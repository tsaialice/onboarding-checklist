<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新人特訓 · GALAGA MIND MAP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000008;color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;width:100vw;height:100vh;cursor:crosshair;}
#galaxy-canvas,#stars-canvas{position:fixed;inset:0;pointer-events:none;}
#galaxy-canvas{z-index:0;}#stars-canvas{z-index:1;}
#game-canvas{position:fixed;inset:0;z-index:2;}
#ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:999;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100;background:linear-gradient(to bottom,rgba(0,0,14,.95),transparent);border-bottom:1px solid rgba(0,245,255,.15);}
#hud-title{font-size:10px;color:#00f5ff;text-shadow:0 0 12px #00f5ff;letter-spacing:2px;}
#hud-score{font-size:13px;color:#fff700;text-shadow:0 0 10px #fff700;}
#hud-lives{font-size:11px;color:#ff00ff;text-shadow:0 0 10px #ff00ff;}

/* Mission card — floats near clicked node */
#info-panel{
  position:fixed;width:300px;
  background:linear-gradient(135deg,rgba(10,4,40,.92),rgba(4,18,50,.94),rgba(8,2,30,.96));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(120,80,255,.5);
  box-shadow:0 0 40px rgba(100,60,255,.2),inset 0 0 40px rgba(60,20,120,.1);
  z-index:300;pointer-events:all;display:none;border-radius:4px;overflow:hidden;
}
#info-panel.visible{display:block;}
.panel-header{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(80,40,160,.14) 0%,transparent 100%);}
.panel-quest-tag{font-size:6px;color:rgba(180,140,255,.5);letter-spacing:2px;margin-bottom:8px;}
.panel-emoji{font-size:28px;line-height:1;display:block;margin-bottom:7px;}
.panel-title{font-family:'Noto Sans TC',sans-serif;font-size:18px;font-weight:900;line-height:1.3;color:#fff;}
.panel-subtitle{font-family:'Noto Sans TC',sans-serif;font-size:11px;color:rgba(180,200,255,.45);margin-top:3px;}
.panel-body{padding:10px 16px 12px;}
.panel-body-label{font-size:6px;letter-spacing:2px;color:rgba(180,140,255,.3);margin-bottom:8px;}
.info-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.info-item:last-child{border-bottom:none;}
.info-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.info-text{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;color:#d4e4ff;line-height:1.6;}
.panel-footer{padding:8px 16px 12px;}
#info-close{display:block;width:100%;background:none;border:1px solid rgba(100,80,255,.35);color:rgba(160,140,255,.6);font-family:'Press Start 2P',monospace;font-size:7px;padding:9px;cursor:pointer;transition:all .15s;border-radius:2px;}
#info-close:hover{border-color:#a78bfa;color:#a78bfa;}

/* Planet nodes — JS controls opacity & transform directly */
.mindmap-node{
  position:fixed;pointer-events:all;cursor:pointer;z-index:60;
  opacity:0;display:block;
  will-change:transform,opacity;
}
.planet-node{position:relative;width:120px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.seq-badge{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:8px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10;border:1.5px solid;background:rgba(0,0,20,.9);}
.planet-ring{position:absolute;inset:-12px;border-radius:50%;border:1.5px solid;opacity:.28;animation:ring-rotate 10s linear infinite;}
.planet-ring.r2{inset:-22px;opacity:.12;animation-duration:18s;animation-direction:reverse;border-style:dashed;}
@keyframes ring-rotate{from{transform:rotate(0deg) scaleY(.26);}to{transform:rotate(360deg) scaleY(.26);}}
.planet-body{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;border:2px solid;transition:transform .2s;}
.planet-body:hover{transform:scale(1.12);}
.planet-emoji{font-size:30px;line-height:1;}
.planet-label{font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:800;margin-top:7px;line-height:1.35;max-width:118px;text-shadow:0 0 10px currentColor;}

#instructions{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:100;pointer-events:none;}
#instructions p{font-size:8px;color:rgba(255,255,255,.4);line-height:2.6;letter-spacing:1px;}

#start-screen{position:fixed;inset:0;background:rgba(0,0,12,.96);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#start-title{font-size:24px;color:#fff700;text-shadow:0 0 24px #fff700;animation:blink-title 1.8s steps(2) infinite;text-align:center;line-height:1.9;}
@keyframes blink-title{0%,100%{opacity:1;}50%{opacity:.78;}}
.start-desc{font-size:11px;color:#00f5ff;text-shadow:0 0 10px #00f5ff;animation:blink 1.1s steps(2) infinite;text-align:center;line-height:2.8;}
@keyframes blink{50%{opacity:0;}}
.start-sub{font-size:8px;color:rgba(255,255,255,.3);letter-spacing:2px;text-align:center;line-height:2.4;}
.start-sep{color:rgba(0,245,255,.15);font-size:8px;}
.unlock-banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;text-align:center;pointer-events:none;z-index:400;line-height:2;}
#screen-flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:350;}
</style>
</head>
<body>
<canvas id="galaxy-canvas"></canvas>
<canvas id="stars-canvas"></canvas>
<canvas id="game-canvas"></canvas>
<div id="ui-layer"></div>
<div id="screen-flash"></div>

<div id="hud">
  <div id="hud-title">新人特訓 · MIND MAP</div>
  <div id="hud-score">SCORE: <span id="score-val">0</span></div>

</div>

<div id="info-panel">
  <div class="panel-header">
    <div class="panel-quest-tag">◈ MISSION INTEL</div>
    <span class="panel-emoji" id="info-emoji"></span>
    <div class="panel-title" id="info-title"></div>
    <div class="panel-subtitle" id="info-sub"></div>
  </div>
  <div class="panel-body">

    <div id="info-list"></div>
  </div>
  <div class="panel-footer"><button id="info-close">[ CLOSE INTEL ]</button></div>
</div>

<div id="instructions">
  <p>← → 移動　SPACE 發射　點擊 BOSS 攻擊　節點展開時點擊清除繼續</p>
</div>

<div id="start-screen">
  <div id="start-title">新人特訓<br>MIND MAP</div>
  <p class="start-sep">─────────────────────────────</p>
  <p class="start-desc">擊敗每個 BOSS 解鎖對應知識！</p>
  <p class="start-desc">PRESS  SPACE  OR  CLICK  TO  START</p>
  <p class="start-sub">← → 移動　SPACE 發射　點擊 BOSS 攻擊　打倒後可重複複習</p>
</div>

<script>
// ── DATA ────────────────────────────────────────────
const SECTIONS=[
  {id:'s1',label:'思考與邏輯面',sub:'Mindset & Logic',color:'#7c3aed',glow:'#a855f7',points:300,shape:'bee',emoji:'🐝',
   nodes:[
    {emoji:'🔍',label:'重新認識 AI',sub:'助理 × 放大鏡',info:['AI Agent 能動手做事，不只是問答工具','輸入不清晰，AI 只會放大無效訊號','最終發想、判斷商業價值仍需人類推一把']},
    {emoji:'⚙️',label:'拆解工作流',sub:'INPUT → PROCESS',info:['別丟大任務等完美答案，會失望放棄','INPUT：原始資料是什麼？','PROCESS：中間需哪些加工判斷？','找出最痛的那一步，把 AI 精準接入']},
    {emoji:'🗂️',label:'情境工程',sub:'Context Engineering',info:['AI 像不懂背景的新同事，沒說絕對不知道','重點是提供充足上下文，非尋找神咒語','6步驟：背景／任務／資料來源／對象／限制／格式']},
    {emoji:'💬',label:'如何給 AI 回饋',sub:'就事論事是最高原則',info:['底層是文字接龍，情緒罵人只會放大壞結果','AI 接到情緒輸入會生成「笨蛋該有的回答」','具體指出哪裡要改：「第 2 點請補責任單位」','「對話」才是正確使用方式，不滿意就追問']},
   ]},
  {id:'s2',label:'技術底層認知',sub:'Technology Basics',color:'#0891b2',glow:'#06b6d4',points:500,shape:'ufo',emoji:'🛸',
   nodes:[
    {emoji:'🚀',label:'AI 三大進化層次',sub:'Chat → Projects → Agent',info:['CHAT：基礎問答，多數人停留在這一層','PROJECTS：結合知識庫，在專案內協作','AGENT：自主操控電腦環境執行任務','重要規則需寫入 memory.md 長期記憶檔']},
    {emoji:'⚠️',label:'資安與幻覺紅線',sub:'絕對不能踩',info:['幻覺：AI 會非常有信心地編造數據','所有數字與報告，人類必須親自查證','使用 Agent 務必使用獨立帳號（獨立 Gmail）','絕對不可讓 AI 接觸公司機密或個人敏感個資']},
   ]},
  {id:'s3',label:'工具挑選與分工',sub:'AI Production Line',color:'#d97706',glow:'#f59e0b',points:700,shape:'octopus',emoji:'🐙',
   nodes:[
    {emoji:'🏢',label:'建立 AI 團隊',sub:'多工具工作流',info:['還在問「哪個 AI 最強」就問錯了','把 AI 工具看成一間公司的員工團隊','問「這件事應該派誰去做」']},
    {emoji:'❓',label:'靈魂三問',sub:'任務分配決策公式',info:['① 任務需要什麼資料？（公開？內部？）','② 資料在哪裡？（網路、雲端、CRM？）','③ 這 AI 能直接幫你操作嗎？']},
    {emoji:'🗺️',label:'五大分工地圖',sub:'AI 員工任務表',info:['🔍 查外部資料 → Perplexity（RAG，標註來源）','🧠 深度推演 → ChatGPT / Claude','🔒 公司內部文件 → Copilot / Gemini','💻 程式開發 → Cursor / Claude Code','📊 業務流程 → Salesforce / Shopify']},
   ]},
  {id:'s4',label:'新時代核心競爭力',sub:'AI Literacy',color:'#059669',glow:'#10b981',points:1000,shape:'mothership',emoji:'👑',
   nodes:[
    {emoji:'👑',label:'分發判斷力',sub:'Routing Judgment',info:['競爭力不在於比拚哪個模型跑分高','而是人類的「分發判斷力 Routing Judgment」','理解工具底層邏輯，把任務配對給對應 AI','建立 AI 識讀能力，成為駕馭 AI 的超級管理者']},
   ]},
];

// ── GALAXY ──────────────────────────────────────────
const gC=document.getElementById('galaxy-canvas'),gX=gC.getContext('2d');
function drawGalaxy(){
  const W=gC.width=innerWidth,H=gC.height=innerHeight;
  gX.fillStyle='#000008';gX.fillRect(0,0,W,H);
  const rg=(x,y,r,s,e)=>{const g=gX.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,s);g.addColorStop(1,e);gX.fillStyle=g;gX.fillRect(0,0,W,H);};
  rg(W*.52,H*.4,W*.6,'rgba(160,90,255,.18)','transparent');
  rg(W*.1,H*.25,W*.42,'rgba(0,120,220,.13)','transparent');
  rg(W*.88,H*.78,W*.38,'rgba(0,190,160,.11)','transparent');
  rg(W*.9,H*.12,W*.3,'rgba(220,60,120,.09)','transparent');
  // Milky Way
  gX.save();gX.translate(W/2,H/2);gX.rotate(-.32);
  const bw=W*1.8,bh=H*.5,bd=gX.createLinearGradient(0,-bh/2,0,bh/2);
  bd.addColorStop(0,'transparent');bd.addColorStop(.5,'rgba(140,100,240,.11)');bd.addColorStop(1,'transparent');
  gX.fillStyle=bd;gX.fillRect(-bw/2,-bh/2,bw,bh);gX.restore();
  // Stars
  for(let i=0;i<800;i++){
    const x=Math.random()*W,y=Math.random()*H,r=Math.random()*.8+.1,a=Math.random()*.5+.1;
    const t=Math.random();
    gX.fillStyle=t<.25?`rgba(190,160,255,${a})`:t<.5?`rgba(150,220,255,${a})`:t<.65?`rgba(255,200,180,${a})`:`rgba(255,255,255,${a})`;
    gX.beginPath();gX.arc(x,y,r,0,Math.PI*2);gX.fill();
  }
  for(let i=0;i<20;i++){
    const x=Math.random()*W,y=Math.random()*H,sz=Math.random()*1.5+.8;
    gX.fillStyle='rgba(230,235,255,.95)';gX.beginPath();gX.arc(x,y,sz,0,Math.PI*2);gX.fill();
    const sg=gX.createRadialGradient(x,y,0,x,y,sz*7);sg.addColorStop(0,'rgba(200,220,255,.2)');sg.addColorStop(1,'transparent');
    gX.fillStyle=sg;gX.beginPath();gX.arc(x,y,sz*7,0,Math.PI*2);gX.fill();
    gX.strokeStyle='rgba(200,220,255,.12)';gX.lineWidth=.5;
    gX.beginPath();gX.moveTo(x-sz*9,y);gX.lineTo(x+sz*9,y);gX.stroke();
    gX.beginPath();gX.moveTo(x,y-sz*9);gX.lineTo(x,y+sz*9);gX.stroke();
  }
}
drawGalaxy();

// ── MOVING STARS ─────────────────────────────────────
const sC=document.getElementById('stars-canvas'),sX=sC.getContext('2d');
const STARS=[];
function initStars(){
  sC.width=innerWidth;sC.height=innerHeight;STARS.length=0;
  for(let i=0;i<160;i++)STARS.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*1.4+.2,sp:Math.random()*.18+.03,b:Math.random(),tw:Math.random()*Math.PI*2});
}
function drawStars(){
  sX.clearRect(0,0,innerWidth,innerHeight);
  STARS.forEach(s=>{s.y+=s.sp;s.tw+=.015;if(s.y>innerHeight){s.y=0;s.x=Math.random()*innerWidth;}
    const a=(.2+s.b*.45)*(.7+.3*Math.sin(s.tw));sX.fillStyle=`rgba(200,220,255,${a})`;sX.fillRect(s.x,s.y,s.s,s.s);});
}
initStars();
window.addEventListener('resize',()=>{drawGalaxy();initStars();resize();});

// ── GAME CANVAS ──────────────────────────────────────
const cv=document.getElementById('game-canvas'),cx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
resize();

// ── BOSS DRAWERS ─────────────────────────────────────
// Each drawer uses cx.save()/restore() to isolate state completely
function drawBee(px,py,sc,col,t){
  const s=sc,bob=Math.sin(t*.04)*4;
  cx.save();cx.translate(px,py+bob);cx.shadowColor=col;cx.shadowBlur=28;
  [[0,-4,10,6,col],[0,4,10,7,'#ffdd00'],[-1,10,3,5,col]].forEach(([dx,dy,w,h,c])=>{
    cx.fillStyle=c;cx.fillRect((-w/2+dx)*s,(-h/2+dy)*s,w*s,h*s);
  });
  cx.fillStyle='#1a1a00';cx.fillRect(-3*s,-10*s,6*s,6*s);
  cx.fillStyle=col;cx.shadowBlur=10;cx.fillRect(-2*s,-8*s,1.5*s,1.5*s);cx.fillRect(s,-8*s,1.5*s,1.5*s);
  const wf=Math.sin(t*.18)*5;
  cx.fillStyle='rgba(180,220,255,.65)';cx.shadowColor='#aaddff';cx.shadowBlur=10;
  cx.fillRect(-14*s,(-6+wf)*s,8*s,5*s);cx.fillRect(6*s,(-6+wf)*s,8*s,5*s);
  cx.fillStyle='#ff4400';cx.shadowColor='#ff4400';cx.shadowBlur=6;cx.fillRect(-1.5*s,12*s,3*s,4*s);
  cx.restore();
}
function drawUFO(px,py,sc,col,t){
  const s=sc,bob=Math.sin(t*.035+1)*4;
  cx.save();cx.translate(px,py+bob);cx.shadowColor=col;cx.shadowBlur=22;
  const ba=.08+Math.abs(Math.sin(t*.06))*.18;
  const bg=cx.createLinearGradient(0,0,0,40*s);bg.addColorStop(0,`rgba(0,245,255,${ba})`);bg.addColorStop(1,'transparent');
  cx.fillStyle=bg;cx.beginPath();cx.moveTo(-3*s,6*s);cx.lineTo(-16*s,40*s);cx.lineTo(16*s,40*s);cx.lineTo(3*s,6*s);cx.closePath();cx.fill();
  cx.fillStyle=col;cx.beginPath();cx.ellipse(0,-3*s,11*s,7*s,0,Math.PI,0);cx.fill();
  cx.fillStyle='rgba(150,230,255,.4)';cx.beginPath();cx.ellipse(0,-3*s,7*s,4*s,0,Math.PI,0);cx.fill();
  cx.fillStyle=col;cx.shadowBlur=16;cx.beginPath();cx.ellipse(0,3*s,17*s,5*s,0,0,Math.PI*2);cx.fill();
  [-11,-5.5,0,5.5,11].forEach((x,i)=>{const on=Math.floor(t/7+i)%2===0;cx.fillStyle=on?'#ffff00':'#333';cx.shadowColor='#ffff00';cx.shadowBlur=on?8:0;cx.fillRect(x*s-1.5,s,3*s,3*s);});
  cx.restore();
}
function drawOctopus(px,py,sc,col,t){
  const s=sc,bob=Math.sin(t*.04+2)*4;
  cx.save();cx.translate(px,py+bob);cx.shadowColor=col;cx.shadowBlur=24;
  for(let i=0;i<6;i++){const ox=(i-2.5)*5.5*s,wv=Math.sin(t*.06+i*.8)*4*s;cx.fillStyle=col;cx.fillRect(ox-1.5*s,9*s,3*s,5*s);cx.fillRect(ox-1.5*s+wv,14*s,3*s,5*s);cx.fillRect(ox-1.5*s,19*s,3*s,4*s);}
  cx.fillStyle=col;cx.beginPath();cx.ellipse(0,0,14*s,11*s,0,0,Math.PI*2);cx.fill();
  cx.shadowBlur=0;cx.fillStyle='white';cx.fillRect(-7*s,-3*s,4*s,5*s);cx.fillRect(3*s,-3*s,4*s,5*s);
  cx.fillStyle='#111';cx.fillRect(-6*s,-2*s,3*s,3*s);cx.fillRect(4*s,-2*s,3*s,3*s);
  cx.fillStyle='white';cx.fillRect(-5.5*s,-1.5*s,s,s);cx.fillRect(4.5*s,-1.5*s,s,s);
  cx.restore();
}
function drawMothership(px,py,sc,col,t){
  const s=sc,bob=Math.sin(t*.03+3)*5;
  cx.save();cx.translate(px,py+bob);cx.shadowColor=col;cx.shadowBlur=32;
  [28,22,16].forEach((r,i)=>{const a=(.12-i*.02)+Math.sin(t*.04+i)*.04;cx.strokeStyle=`rgba(16,185,129,${a})`;cx.lineWidth=2;cx.beginPath();cx.ellipse(0,0,r*s,r*.35*s,0,0,Math.PI*2);cx.stroke();});
  cx.fillStyle=col;cx.beginPath();cx.ellipse(0,0,25*s,8*s,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#1a5c40';cx.shadowBlur=12;cx.beginPath();cx.ellipse(0,-6*s,14*s,10*s,0,Math.PI,0);cx.fill();
  cx.fillStyle='rgba(100,255,180,.32)';cx.beginPath();cx.ellipse(0,-6*s,8*s,5*s,0,Math.PI,0);cx.fill();
  [-17,17].forEach(x=>{cx.fillStyle='#333';cx.shadowBlur=0;cx.fillRect(x*s-1.5*s,5*s,3*s,7*s);cx.fillStyle='#ff4400';cx.shadowColor='#ff4400';cx.shadowBlur=6;cx.fillRect(x*s-1.5*s,12*s,3*s,3*s);});
  [-20,-10,0,10,20].forEach((x,i)=>{const on=Math.floor(t/5+i)%3===0;cx.fillStyle=on?'#ffff44':'#332200';cx.shadowColor='#ffff44';cx.shadowBlur=on?8:0;cx.fillRect(x*s-1.5*s,-1.5*s,3*s,3*s);});
  cx.restore();
}
const DR={bee:drawBee,ufo:drawUFO,octopus:drawOctopus,mothership:drawMothership};

// ── PLAYER ───────────────────────────────────────────
function drawPlayer(px,py){
  cx.save();cx.translate(px,py);
  // engine flame
  const fl=10+Math.random()*8;
  const fg=cx.createLinearGradient(0,12,0,12+fl+8);fg.addColorStop(0,'rgba(255,140,0,.95)');fg.addColorStop(.4,'rgba(255,60,0,.6)');fg.addColorStop(1,'transparent');
  cx.fillStyle=fg;cx.fillRect(-3,12,6,fl+8);

// ── GAME STATE ───────────────────────────────────────
const G={
  started:false,
  px:0,py:0,pspeed:5,
  bullets:[],ebullets:[],
  enemies:[],particles:[],waves:[],
  nodes:[],   // {el, x, y, tx, ty, opacity, phase, floatT, secId, nodeIdx}
  connectors:[],  // {sx,sy,ex,ey,color,sec,type,visible,alpha}
  activeSecId:null,
  infoConnector:null, // line from node to card
  score:0,t:0,keys:{},cooldown:0,etimer:0,mouseX:null,mouseY:null,autoShoot:false,
  nodesUp:false,
};
const ROOT={x:0,y:0};

function buildEnemies(){
  const sp=Math.min(200,(W-160)/4),sx=W/2-sp*1.5;
  G.enemies=SECTIONS.map((s,i)=>({
    ...s,x:sx+i*sp,y:130,bx:sx+i*sp,by:130,
    hp:s.shape==='mothership'?3:s.shape==='octopus'?2:1,
    maxHp:s.shape==='mothership'?3:s.shape==='octopus'?2:1,
    dead:false,hit:0,alpha:1,oscillate:i*.8,dive:null,
    sc:s.shape==='mothership'?4:s.shape==='octopus'?3.5:3,
  }));

// Node positions spread across centre
function nodePositions(n){
  const L=80,R=W-340,T=210,B=H-160,ZW=R-L,ZH=B-T;
  if(n===1)return[{x:L+ZW*.45,y:T+ZH*.45}];
  if(n===2)return[{x:L+ZW*.25,y:T+ZH*.42},{x:L+ZW*.72,y:T+ZH*.42}];
  if(n===3)return[{x:L+ZW*.14,y:T+ZH*.28},{x:L+ZW*.55,y:T+ZH*.65},{x:L+ZW*.85,y:T+ZH*.25}];
  return[{x:L+ZW*.12,y:T+ZH*.22},{x:L+ZW*.6,y:T+ZH*.2},{x:L+ZW*.2,y:T+ZH*.7},{x:L+ZW*.68,y:T+ZH*.65}];
}

// ── CLEAR NODES (JS-driven fade out) ─────────────────
function clearNodes(cb){
  hideInfoPanel();
  G.nodesUp=false;
  G.connectors=G.connectors.filter(c=>c.sec!==G.activeSecId);
  G.infoConnector=null;
  // Fade each node out via JS
  G.nodes.forEach(n=>{n.phase='out';});
  setTimeout(()=>{
    G.nodes.forEach(n=>{if(n.el&&n.el.parentNode)n.el.parentNode.removeChild(n.el);});
    G.nodes=[];G.activeSecId=null;
    if(cb)cb();
  },400);
}

// ── SPAWN NODES ───────────────────────────────────────
function spawnNodes(secId,dx,dy){
  if(G.nodes.length){clearNodes(()=>doSpawn(secId,dx,dy));return;}
  doSpawn(secId,dx,dy);
}

function doSpawn(secId,dx,dy){
  const sec=SECTIONS.find(s=>s.id===secId);if(!sec)return;
  G.activeSecId=secId;G.nodesUp=true;
  const pos=nodePositions(sec.nodes.length);

  sec.nodes.forEach((n,i)=>{
    const {x:tx,y:ty}=pos[i];
    const el=document.createElement('div');
    el.className='mindmap-node';
    // Start at boss death position, fly to tx,ty via JS
    el.style.left=tx+'px';el.style.top=ty+'px';
    el.style.opacity='0';
    el.style.transform=`translate(calc(-50% + ${dx-tx}px), calc(-50% + ${dy-ty}px)) scale(.05)`;

    const pn=document.createElement('div');pn.className='planet-node';
    if(sec.nodes.length>1){
      const b=document.createElement('div');b.className='seq-badge';
      b.style.borderColor=sec.glow;b.style.color=sec.glow;b.style.boxShadow=`0 0 8px ${sec.glow}55`;
      b.textContent=['①','②','③','④'][i];pn.appendChild(b);
    }
    const r1=document.createElement('div');r1.className='planet-ring';r1.style.borderColor=sec.glow;pn.appendChild(r1);
    const r2=document.createElement('div');r2.className='planet-ring r2';r2.style.borderColor=sec.color;pn.appendChild(r2);

    const body=document.createElement('div');body.className='planet-body';
    body.style.background=`radial-gradient(circle at 35% 35%,${sec.color}55,rgba(0,0,20,.92))`;
    body.style.borderColor=sec.glow;
    body.style.boxShadow=`0 0 24px ${sec.color}55,0 0 6px ${sec.glow},inset 0 0 14px ${sec.color}22`;
    const em=document.createElement('div');em.className='planet-emoji';em.textContent=n.emoji;body.appendChild(em);pn.appendChild(body);

    const lb=document.createElement('div');lb.className='planet-label';lb.style.color=sec.glow;lb.textContent=n.label;pn.appendChild(lb);

    body.addEventListener('click',e=>{e.stopPropagation();openCard(sec,n,tx,ty);});
    el.appendChild(pn);
    document.getElementById('ui-layer').appendChild(el);

    const nd={el,x:tx,y:ty,opacity:0,phase:'in',floatT:Math.random()*Math.PI*2,delay:i*110,born:G.t,secId,ni:i};
    G.nodes.push(nd);

    // root connector
    G.connectors.push({type:'root',sx:ROOT.x,sy:ROOT.y,ex:tx,ey:ty,color:sec.color,sec:secId,alpha:0});
  });

  // flow connectors
  if(sec.nodes.length>1){
    for(let i=0;i<sec.nodes.length-1;i++){
      G.connectors.push({type:'flow',sx:pos[i].x,sy:pos[i].y,ex:pos[i+1].x,ey:pos[i+1].y,color:sec.glow,sec:secId,alpha:0,delay:sec.nodes.length*110+340*i});
    }
  }
}

// ── UPDATE NODES each frame ───────────────────────────
function updateNodes(){
  G.nodes.forEach(nd=>{
    const age=(G.t-nd.born)*16-nd.delay; // ms approx
    if(nd.phase==='in'){
      if(age<0){nd.el.style.opacity='0';return;}
      const prog=Math.min(1,age/600);
      // ease out back
      const ease=1+2.7*(prog-1)*(prog-1)*(prog-1)+1.7*(prog-1)*(prog-1);
      nd.opacity=Math.min(1,prog*1.5);
      nd.el.style.opacity=nd.opacity;
      nd.el.style.transform=`translate(-50%,-50%) scale(${ease})`;
      if(prog>=1)nd.phase='float';
    } else if(nd.phase==='float'){
      nd.floatT+=.018;
      const fy=Math.sin(nd.floatT)*5;
      nd.el.style.opacity='1';
      nd.el.style.transform=`translate(-50%, calc(-50% + ${fy}px))`;
    } else if(nd.phase==='out'){
      nd.opacity=Math.max(0,nd.opacity-.06);
      nd.el.style.opacity=nd.opacity;
      nd.el.style.transform=`translate(-50%,-50%) scale(${.5+nd.opacity*.5})`;
    }
  });

  // update connector alphas
  G.connectors.forEach(c=>{
    if(c.sec!==G.activeSecId)return;
    if(c.type==='root'){
      const matching=G.nodes.find(n=>Math.abs(n.x-c.ex)<2&&Math.abs(n.y-c.ey)<2);
      c.alpha=matching?matching.opacity:0;
    } else if(c.type==='flow'){
      const elapsed=(G.t*16)-c.delay;
      if(elapsed>0)c.alpha=Math.min(.85,c.alpha+.03);
    }
  });
}

// ── CONNECTORS DRAW ───────────────────────────────────
function drawConnectors(){
  G.connectors.forEach(c=>{
    if(c.sec!==G.activeSecId||c.alpha<=0)return;
    cx.save();
    if(c.type==='root'){
      cx.globalAlpha=c.alpha*.4;cx.strokeStyle=c.color;cx.lineWidth=1;
      cx.setLineDash([4,12]);cx.lineDashOffset=-G.t*.2;
      const mx=(c.sx+c.ex)/2+(c.ey-c.sy)*.08,my=(c.sy+c.ey)/2-(c.ex-c.sx)*.08;
      cx.beginPath();cx.moveTo(c.sx,c.sy);cx.quadraticCurveTo(mx,my,c.ex,c.ey);cx.stroke();cx.setLineDash([]);
    } else if(c.type==='flow'){
      cx.globalAlpha=c.alpha;cx.strokeStyle=c.color;cx.lineWidth=2;cx.shadowColor=c.color;cx.shadowBlur=7;
      cx.setLineDash([7,5]);cx.lineDashOffset=-G.t*.45;
      const mx=(c.sx+c.ex)/2,my=(c.sy+c.ey)/2;
      const nrx=-(c.ey-c.sy),nry=(c.ex-c.sx),nl=Math.sqrt(nrx*nrx+nry*nry)||1;
      const cpx=mx+nrx/nl*40,cpy=my+nry/nl*40;
      cx.beginPath();cx.moveTo(c.sx,c.sy);cx.quadraticCurveTo(cpx,cpy,c.ex,c.ey);cx.stroke();cx.setLineDash([]);
      const ang=Math.atan2(c.ey-cpy,c.ex-cpx);
      cx.fillStyle=c.color;cx.shadowBlur=8;
      cx.beginPath();cx.moveTo(c.ex,c.ey);cx.lineTo(c.ex-14*Math.cos(ang-.38),c.ey-14*Math.sin(ang-.38));cx.lineTo(c.ex-14*Math.cos(ang+.38),c.ey-14*Math.sin(ang+.38));cx.closePath();cx.fill();
    }
    cx.restore();
  });
  // info card connector
  if(G.infoConnector){
    const ic=G.infoConnector;
    cx.save();cx.globalAlpha=.6;cx.strokeStyle=ic.color;cx.lineWidth=1.5;cx.shadowColor=ic.color;cx.shadowBlur=6;
    cx.setLineDash([5,8]);cx.lineDashOffset=-G.t*.3;
    cx.beginPath();cx.moveTo(ic.sx,ic.sy);cx.lineTo(ic.ex,ic.ey);cx.stroke();cx.setLineDash([]);cx.restore();
  }
}

function drawRootNode(){

// ── EXPLOSION ─────────────────────────────────────────

  for(let i=0;i<65;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*22+8;G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:50,ml:50,sz:Math.random()*3+1,col:Math.random()>.5?'#fff':glow,sq:false});}

// ── HIT ENEMY ─────────────────────────────────────────
function hitEnemy(en){
  en.hp--;en.hit=10;playSound('hit');
  if(en.hp<=0&&!en.dead){
    en.dead=true;
    boom(en.x,en.y,en.color,en.glow);
    G.score+=en.points;
    document.getElementById('score-val').textContent=G.score;
    document.getElementById('enemies-left').textContent=G.enemies.filter(e=>!e.dead).length;
    playSound('explode');
    showUnlock(en);
    reviveOthers(G.enemies.indexOf(en));
    spawnNodes(en.id,en.x,en.y);
  }
}

function reviveOthers(skipIdx){
  G.enemies.forEach((en,i)=>{
    if(i!==skipIdx&&en.dead){
      en.dead=false;en.hp=en.maxHp;en.hit=0;en.alpha=0;
      const iv=setInterval(()=>{en.alpha=Math.min(1,en.alpha+.025);if(en.alpha>=1)clearInterval(iv);},16);
    }
  });
  document.getElementById('enemies-left').textContent=G.enemies.filter(e=>!e.dead).length;
}

function showUnlock(sec){
  const d=document.createElement('div');d.className='unlock-banner';
  d.style.cssText+=`color:${sec.glow};text-shadow:0 0 20px ${sec.glow};font-family:'Press Start 2P',monospace;font-size:14px;animation:ua 2.2s forwards;`;
  d.innerHTML=`UNLOCKED!<br><span style="font-size:10px;color:rgba(255,255,255,.75)">${sec.label}</span>`;
  document.body.appendChild(d);
  const st=document.createElement('style');
  st.textContent=`@keyframes ua{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}15%{opacity:1;transform:translate(-50%,-65%) scale(1.3);}65%{opacity:1;transform:translate(-50%,-70%) scale(1);}100%{opacity:0;transform:translate(-50%,-90%) scale(.9);}}`;
  document.head.appendChild(st);
  setTimeout(()=>{d.remove();st.remove();},2400);
}

// ── SOUND ─────────────────────────────────────────────
let aCtx;
function au(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx;}
function playSound(t){
  try{const ac=au(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    if(t==='shoot'){o.type='square';o.frequency.setValueAtTime(880,ac.currentTime);o.frequency.exponentialRampToValueAtTime(220,ac.currentTime+.08);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);o.start();o.stop(ac.currentTime+.08);}
    else if(t==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(400,ac.currentTime);o.frequency.exponentialRampToValueAtTime(100,ac.currentTime+.1);g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.1);o.start();o.stop(ac.currentTime+.1);}
    else if(t==='explode'){
      const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);
      o.type='sawtooth';o.frequency.setValueAtTime(180,ac.currentTime);o.frequency.exponentialRampToValueAtTime(25,ac.currentTime+.6);g.gain.setValueAtTime(.35,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.start();o.stop(ac.currentTime+.6);
      o2.type='square';o2.frequency.setValueAtTime(60,ac.currentTime);o2.frequency.exponentialRampToValueAtTime(15,ac.currentTime+.4);g2.gain.setValueAtTime(.25,ac.currentTime);g2.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o2.start();o2.stop(ac.currentTime+.4);
    }
  }catch(e){}
}

// ── MAIN LOOP ─────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  drawStars();
  cx.clearRect(0,0,W,H);
  if(!G.started){
    // preview bosses on start screen
    const sp=Math.min(185,(W-120)/4);
    SECTIONS.forEach((s,i)=>{
      const x=W/2-sp*1.5+i*sp,y=H/2-20;
      DR[s.shape](x,y,2.8,s.color,G.t);
      cx.save();cx.font='bold 14px "Noto Sans TC",sans-serif';cx.fillStyle=s.glow;cx.shadowColor=s.glow;cx.shadowBlur=10;cx.textAlign='center';cx.fillText(s.label,x,y+76);cx.restore();
    });
    G.t++;return;
  }
  G.t++;

  // Player movement — mouse follow + keyboard fallback
  if(G.mouseX!==null){
    const diffX=G.mouseX-G.px;
    G.px+=diffX*.12;
    // Y follow — clamped to lower 55% of screen so ship stays below bosses
    const minY=H*.45, maxY=H-40;
    const targetY=Math.max(minY,Math.min(maxY,G.mouseY||G.py));
    G.py+=(targetY-G.py)*.1;
  }
  if(G.keys['ArrowLeft']||G.keys['KeyA'])G.px-=G.pspeed;
  if(G.keys['ArrowRight']||G.keys['KeyD'])G.px+=G.pspeed;
  G.px=Math.max(30,Math.min(W-30,G.px));
  // Auto-shoot when moving with mouse
  if(G.cooldown>0)G.cooldown--;
  else if(G.mouseX!==null&&G.autoShoot&&!G.nodesUp){shoot();}

  // Enemy shoot
  if(!G.nodesUp){
    G.etimer++;
    const alive=G.enemies.filter(e=>!e.dead&&e.alpha>.9);
    const si=Math.max(80,210-alive.length*30);
    if(G.etimer>=si&&alive.length){G.etimer=0;const sh=alive[Math.floor(Math.random()*alive.length)];const dx=G.px-sh.x,dy=G.py-sh.y,dl=Math.sqrt(dx*dx+dy*dy);G.ebullets.push({x:sh.x,y:sh.y,vx:dx/dl*5,vy:dy/dl*5,col:sh.glow});}
  }

  // Draw enemies — oscillate + dive movement (from original)
  G.enemies.forEach((en,i)=>{
    if(en.dead)return;
    en.oscillate+=0.018;
    if(en.dive){
      en.dive.t++;
      const prog=en.dive.t/120;
      if(prog<1){
        en.x=en.dive.sx+(en.dive.tx-en.dive.sx)*easeInOut(prog);
        en.y=en.dive.sy+(en.dive.ty-en.dive.sy)*easeInOut(prog)+Math.sin(prog*Math.PI)*80;
      } else {
        en.x=en.bx;en.y=en.by;en.dive=null;
      }
    } else {
      en.x=en.bx+Math.sin(en.oscillate+i*.5)*22;
      en.y=en.by+Math.cos(en.oscillate*.7)*10;
      if(Math.random()<0.002&&G.t>120&&!G.nodesUp){
        en.dive={sx:en.x,sy:en.y,tx:G.px+(Math.random()-.5)*100,ty:H*.65,t:0};
      }
    }
    cx.save();cx.globalAlpha=en.alpha;
    if(en.hit>0){en.hit--;if(Math.floor(G.t/2)%2===0)cx.globalAlpha=en.alpha*.3;}
    DR[en.shape](en.x,en.y,en.sc,en.color,G.t);
    // label
    const ly=en.y+en.sc*26+12;
    cx.font='bold 17px "Noto Sans TC",sans-serif';cx.fillStyle=en.glow;cx.shadowColor=en.glow;cx.shadowBlur=16;cx.textAlign='center';cx.fillText(en.label,en.x,ly);
    cx.font='10px "Press Start 2P"';cx.fillStyle='rgba(255,255,255,.38)';cx.shadowBlur=0;cx.fillText(en.sub,en.x,ly+20);
    cx.restore();
  });

  // Player bullets
  G.bullets=G.bullets.filter(b=>{
    b.y-=b.sp;if(b.y<-10)return false;
    if(!G.nodesUp){
      for(const en of G.enemies){
        if(en.dead||en.alpha<.5)continue;
        if(Math.abs(b.x-en.x)<en.sc*18&&Math.abs(b.y-en.y)<en.sc*18){hitEnemy(en);return false;}
      }
    }
    cx.save();cx.fillStyle='#00f5ff';cx.shadowColor='#00f5ff';cx.shadowBlur=10;cx.fillRect(b.x-2,b.y-9,4,18);cx.restore();
    return true;
  });

  // Enemy bullets
  G.ebullets=G.ebullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;if(b.y>H+20||b.x<0||b.x>W)return false;
    cx.save();cx.fillStyle=b.col;cx.shadowColor=b.col;cx.shadowBlur=6;cx.fillRect(b.x-2,b.y-6,4,12);cx.restore();
    return true;
  });

  // Shockwaves
  G.waves=G.waves.filter(w=>{
    w.r+=(w.mr-w.r)*.18;w.life--;const a=(w.life/w.ml)*.5;
    cx.save();cx.globalAlpha=a;cx.strokeStyle=w.color;cx.lineWidth=3*a+.5;cx.shadowColor=w.color;cx.shadowBlur=20;
    cx.beginPath();cx.arc(w.x,w.y,w.r,0,Math.PI*2);cx.stroke();cx.restore();
    return w.life>0;
  });

  // Particles
  G.particles=G.particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;const dr=p.dr||.91;p.vx*=dr;p.vy*=dr;p.vy+=.07;p.life--;
    const a=p.life/p.ml,sz=p.sz*(.5+.5*a);
    cx.save();cx.globalAlpha=a;cx.fillStyle=p.col;cx.shadowColor=p.col;cx.shadowBlur=5;
    if(p.sq)cx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);
    else{cx.beginPath();cx.arc(p.x,p.y,sz/2,0,Math.PI*2);cx.fill();}
    cx.restore();return p.life>0;
  });

  // Update & draw node system
  updateNodes();
  drawConnectors();
  drawRootNode();
  drawPlayer(G.px,G.py);

  // Ground
  cx.save();cx.strokeStyle='rgba(0,245,255,.1)';cx.lineWidth=1;cx.beginPath();cx.moveTo(0,H-40);cx.lineTo(W,H-40);cx.stroke();cx.restore();
}

function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
G.t=0;loop();
</script>
</body>
</html>
